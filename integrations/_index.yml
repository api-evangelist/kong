# Kong integrations, recreated as Arazzo (roadmap#949). SCRIPT-OWNED: derive-integrations-index.py.
# One entry per integration the provider defines: from its own integrations page, its marketplace
# listings (integration-edges.yml) and the named workflow templates those listings publish.
# `arazzo` names the workflow that implements it; otherwise `status` says why there is none.
# The evidence is in kong-integration-edges.yml; the workflows are generated by API Evangelist.
- slug: kong-datadog
  label: Stream Kong gateway metrics into Datadog
  partner: datadog
  category: Observability
  use_case: Enable the Kong Datadog plugin against a service/route so request, latency, and upstream metrics are
    pushed into Datadog with per-route tags. Optionally enrich with Datadog monitor lookups for alerting context.
  source: curated
  status: pending-generation
  arazzo: null
- slug: kong-prometheus
  label: Scrape Kong metrics into Prometheus
  partner: prometheus
  category: Observability
  use_case: Enable the Kong Prometheus plugin on a workspace so a Prometheus server can scrape the standardized
    /metrics endpoint. The integration registers the scrape target via Prometheus' admin API.
  source: curated
  status: pending-partner-spec
  arazzo: null
- slug: kong-splunk
  label: Forward Kong gateway logs into Splunk HEC
  partner: splunk
  category: Observability
  use_case: Enable the Kong HTTP Log plugin pointed at a Splunk HTTP Event Collector endpoint so every gateway request
    becomes a structured Splunk event with route/service/consumer tags.
  source: curated
  status: pending-generation
  arazzo: null
- slug: kong-slack
  label: Post Kong gateway alerts and deploy events to Slack
  partner: slack
  category: Alerting
  use_case: When new Kong services or routes are created (or plugins enabled), post a change summary to a Slack
    channel via Incoming Webhook so platform teams have a real-time audit feed.
  source: curated
  status: pending-generation
  arazzo: null
- slug: kong-github
  label: Sync OpenAPI specs from GitHub into Konnect API packages
  partner: github
  category: Spec sync
  use_case: On a push to a designated GitHub repository, fetch the updated OpenAPI document and upload it as the
    current specification on a Konnect API package, then publish it to the configured dev portal.
  source: curated
  status: pending-generation
  arazzo: null
- slug: kong-opa
  label: Externalize Kong authz decisions to Open Policy Agent
  partner: opa
  category: Policy
  use_case: Enable the Kong OPA plugin against a service or route so every request is evaluated by an external Open
    Policy Agent decision endpoint. The integration also publishes the policy bundle to OPA.
  source: curated
  status: pending-partner-spec
  arazzo: null
- slug: kong-keycloak
  label: Validate Kong-issued JWTs against Keycloak realms
  partner: keycloak
  category: Identity
  use_case: Configure the Kong JWT plugin so tokens issued by a Keycloak realm are validated at the gateway. The
    integration also reads the realm's JWKS and registers the public key as a Kong JWT credential per consumer.
  source: curated
  status: pending-generation
  arazzo: null
- slug: kong-auth0
  label: Front Auth0-protected APIs with the Kong gateway
  partner: auth0
  category: Identity
  use_case: Configure Kong's JWT plugin to validate Auth0-issued access tokens against the tenant's JWKS, and bind
    matching Kong consumers to Auth0 users so per-user rate-limiting and ACL plugins can be layered on top.
  source: curated
  status: pending-generation
  arazzo: null
- slug: kong-anthropic
  label: Front Anthropic Claude through the Kong AI Gateway
  partner: anthropic
  category: AI Gateway
  use_case: Configure Kong's AI Proxy and AI Prompt Guard plugins so Anthropic Claude requests are routed, rate-limited,
    and policy-checked at the gateway. The integration also exercises the Anthropic API to verify model availability.
  source: curated
  status: pending-generation
  arazzo: null
- slug: kong-openai
  label: Front OpenAI through the Kong AI Gateway
  partner: openai
  category: AI Gateway
  use_case: Configure Kong's AI Proxy plugin to broker OpenAI traffic, applying per-consumer rate-limiting, prompt
    guard policies, and OpenTelemetry tracing. The integration creates the upstream service and wires the plugin
    chain.
  source: curated
  status: pending-generation
  arazzo: null
- slug: kong-apigee
  label: Migrate Apigee proxies into Kong services and routes
  partner: apigee
  category: Migration
  use_case: Walk an Apigee organization's API proxies and materialize an equivalent Kong service plus routes for
    each, preserving virtual host bindings and basic auth/JWT policy hints as Kong plugin configurations.
  source: curated
  status: pending-generation
  arazzo: null
- slug: kong-aws-apigateway
  label: Migrate AWS API Gateway into Kong Konnect control planes
  partner: aws-apigateway
  category: Migration
  use_case: For each AWS API Gateway REST API in an account, register a corresponding Konnect control plane (or
    workspace) and create Kong services/routes mirroring the AWS resources and methods. Plugin equivalents (usage
    plans → rate-limiting, Cognito authorizers → JWT) are wired in by the integration.
  source: curated
  status: pending-partner-spec
  arazzo: null

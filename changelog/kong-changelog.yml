- breaking: true
  highlights:
  - 'The FIPS artifact serves an explicit TLS 1.2 cipher list: four ECDHE suites with AES-GCM.'
  - It replaces the OpenSSL FIPS alias, which resolves to 28 suites and also admits static RSA key transport and SSLv3-era suites.
  - The `kong-ai-gateway-fips` package becomes `kong-ai-gateway-fips-140-3` and the `<version>-<distro>-fips` image becomes `<version>-<distro>-fips-140-3`.
  - A deployment moving from the retired `kong-ai-gateway-fips` package that relies on one of the dropped suites must set `ssl_cipher_suite =
    custom` and `ssl_ciphers`.

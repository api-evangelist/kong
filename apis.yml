- aid: kong:kong-insomnia
  name: Kong Insomnia
  description: >-
    Kong Insomnia is an open-source API development platform for designing, debugging, and testing APIs.
    It supports REST, GraphQL, gRPC, and WebSocket protocols and provides collections, environments, mock
    servers, OpenAPI editing, Git Sync, and native vault integrations for developers and platform teams.

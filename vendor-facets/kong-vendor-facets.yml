# Vendor facets — Kong (Kong Gateway + Konnect Dev Portal; Insomnia is profiled separately). The only
# gateway here whose default rate-limiting plugin emits the RateLimit-* and X-RateLimit-* headers on
# every response, and a Konnect portal with self-service sign-up, app registration and DCR against the
# customer's IdP. What it cannot reach: rate-limit headers inside the provider's OpenAPI, a served
# OAuth discovery or protected-resource document, public pricing, SDKs.
vendor: kong
name: Kong
website: https://konghq.com
areas:
- developer-portal
- api-gateway
registry_keys:
- kong
rubric_schema_version: 0.22.0
generated: '2026-09-25'
features_refreshed: '2026-09-25'
basis: capability
summary: >-
  Kong lands on developer ergonomics and access clarity through the Konnect Dev Portal: a branded API
  catalog, OpenAPI/AsyncAPI reference, try-it console and self-service sign-up with keys — each scored
  only once declared in apis.yml. Its Rate Limiting plugin emits RateLimit-* and X-RateLimit-* headers
  by default, but the `verified` grade reads those headers from the provider's OpenAPI, which the plugin
  does not write. The AI MCP Proxy converts routes to MCP tools on the customer's gateway (Enterprise,
  `templated`), and the portal's DCR registers clients at the customer's IdP rather than serving a registration
  endpoint Kong's customers can be scored for.
features:
- id: rate-limiting-plugin
  name: Rate Limiting plugin with RateLimit-* / X-RateLimit-* headers
  description: >-
    Emits RateLimit-Limit, RateLimit-Remaining, RateLimit-Reset (IETF draft), X-RateLimit-Limit-<window>/Remaining-<window>
    and Retry-After on 429 by default (hide_client_headers turns them off); 429 body is {"message":"API
    rate limit exceeded"}.
  source: https://developer.konghq.com/plugins/rate-limiting/
  tier: open-source
- id: ai-mcp-proxy
  name: AI MCP Proxy plugin
  description: >-
    Converts a Kong-managed REST service into MCP tools from its OpenAPI (conversion-listener / conversion-only
    / listener modes) or proxies upstream MCP servers, served on a Kong route.
  source: https://developer.konghq.com/plugins/ai-mcp-proxy/
  tier: enterprise
- id: konnect-dev-portal
  name: Konnect Dev Portal
  description: >-
    Branded API catalog with OpenAPI/AsyncAPI docs, try-it in browser and Insomnia, Markdown page editor,
    search, multiple portals, and an MCP server so coding agents can use portal APIs.
  source: https://konghq.com/products/kong-konnect/features/developer-portal
  tier: paid
- id: self-service-registration
  name: Developer self-service and application registration
  description: >-
    Developers sign up, create an application, register it with an API and retrieve keys without admin
    involvement; auth strategies are key auth, OIDC, or DCR that creates the client at the customer's
    IdP (Okta, Auth0, Azure AD, Curity).
  source: https://developer.konghq.com/dev-portal/self-service/
  tier: paid
- id: kong-identity
  name: Kong Identity managed authorization server
  description: >-
    A Konnect-managed OAuth 2.0 authorization server (auth servers, scopes, claims, clients) used with
    the OIDC plugin; the fetched guide issues tokens with client_credentials.
  source: https://developer.konghq.com/how-to/configure-kong-identity-oidc/
  tier: paid
- id: metering-billing
  name: Konnect Metering & Billing (OpenMeter)
  description: Usage metering, plans made of rate cards, subscriptions, invoicing and Stripe/CRM integrations.
  source: https://developer.konghq.com/metering-and-billing/
  tier: paid
- id: portal-analytics
  name: Portal and API analytics
  description: Usage, request volume, error rate and latency metrics for published APIs.
  source: https://konghq.com/products/kong-konnect/features/developer-portal
  tier: paid

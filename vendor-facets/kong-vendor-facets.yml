  catalog_pass_rate: 0.453
  facet: developer_ergonomics
  points: 4
  baseline_pass_rate: 0.95
  saturated: true
  saturated_note: >-
    95% of providers with a contract, docs and a reference already earn this; the vendor cannot move it
    for most of its buyers.
- feature: self-service-registration
  check: sign_up_present
  layer: composite
  provider_must: Enable developer sign-up and declare the page as SignUp or Login in apis.yml common[].
  catalog_pass_rate: 0.19
  facet: access_clarity
  points: 5
  baseline_pass_rate: 0.463
- feature: rate-limiting-plugin
  check: rate_limit_signal
  layer: agent_readiness
  grade: documented
  partial: true
  partial_note: >-
    The plugin emits exactly the headers the `verified` grade names, but the grade reads them from response
    headers declared in the provider's OpenAPI, and nothing fetched shows Kong adding them to the spec.
    Until the provider declares them, only the `documented` fallback (a published rate_limits artifact)
    is reachable.
  points: 7
  baseline_pass_rate: 0.381
- feature: ai-mcp-proxy
  check: mcp_server
  layer: agent_readiness
  grade: templated
  note: >-
    Tools come from the provider's own OpenAPI and are served on the provider's own Kong route and host,
    so `templated` (0.6). Enterprise-only (AI Gateway Enterprise). `verified` only if the catalog probe
    of the provider's mcp/ manifest passes.
  points: 12
  baseline_pass_rate: 0.22
- feature: self-service-registration
  check: delegated_identity
  layer: agent_readiness
  grade: documented
  conditional: true
  condition: >-
    Only if the provider's OpenAPI declares an oauth2 authorizationCode flow or openIdConnect scheme —
    the portal's OIDC strategy configures the gateway, it does not write the provider's contract.
  points: 6
  baseline_pass_rate: 0.209
earns_nothing:
- feature: self-service-registration
  check: dynamic_client_registration
  why: >-
    Konnect's DCR is Kong calling the customer's IdP to create portal apps; the check reads a registration_endpoint
    in a served discovery document, which is the IdP's, not something Kong serves on the provider's domain.
- feature: kong-identity
  check: auth_clarity
  why: >-
    The fetched guide shows a Konnect-managed issuer and client_credentials tokens, but not an openid-configuration
    served on the provider's host, and client_credentials does not satisfy delegated_identity's authorization_code
    test.
- feature: metering-billing
  check: plans_present
  why: >-
    The fetched page describes plans assigned to customers via subscriptions, not a public plan catalog
    on the portal; the plans artifact is harvested from public pricing pages.
- feature: portal-analytics
  why: Analytics help the provider and no check reads them.
- feature: konnect-dev-portal
  check: mcp_server
  why: >-
    The portal MCP server serves the portal's catalog to coding agents on Kong's portal product; it is
    not the provider's API as an MCP server, and the rubric grades the latter.
out_of_reach:
  checks:
  - sdk_count_1
  - sdk_count_3
  - cli_present
  - idempotency
  - dry_run_mode
  - reversibility_documented
  - protected_resource_metadata
  - well_known_published
  - agent_card
  - pricing_link
  - change_log_present
  - status_page_present
  note: >-
    Nothing fetched shows Kong serving a protected-resource or discovery document on the provider's host,
    and SDKs, pricing and API behaviours are the provider's to publish.
unscored_practice:
- feature: rate-limiting-plugin
  why: >-
    Kong is the one gateway in this set that emits both IETF RateLimit-* and X-RateLimit-* headers by
    default; the rubric only credits it when the provider writes them into its contract.
